name: build-agentmemory

on:
  workflow_dispatch:
    inputs:
      version:
        description: agentmemory package version to publish
        required: true
        default: 0.9.26

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agentmemory
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            AGENTMEMORY_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/agentmemory:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/agentmemory:latest
