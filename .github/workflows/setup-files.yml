# Customization Guide

## Changing Versions

### agentmemory Version (Easy — No Code Changes)

Each time you want to rebuild with a new agentmemory version:

1. **GitHub** → **Actions** → **Build & Push agentmemory**
2. Click **Run workflow**
3. Set **agentmemory_version** to any npm version (e.g., `0.9.27`, `0.10.0`)
4. Click **Run workflow**

No code edits needed. The workflow accepts any npm version as input.

### iii-engine Version (Requires Code Change)

If upgrading to a different iii-engine version:

1. Edit `Dockerfile.iii-engine`:
   ```dockerfile
   # Line 11: Update the version in the download URL
   https://github.com/iii-hq/iii/releases/download/iii/v0.11.2/iii-x86_64-unknown-linux-gnu.tar.gz
   # Change v0.11.2 to desired version
   ```

2. Edit `.github/workflows/build-iii.yml`:
   ```yaml
   # Line 10: Update VERSION
   VERSION: 0.11.2
   # Change to new version
   ```

3. Update `docker-compose.yml`:
   ```yaml
   # Line 10: Update image tag
   image: *registry/iii-engine:0.11.2
   # Change to new version
   ```

4. Commit and push:
   ```bash
   git add Dockerfile.iii-engine .github/workflows/build-iii.yml docker-compose.yml
   git commit -m "Upgrade iii-engine to v0.X.Y"
   git push origin main
   ```

5. Build triggers automatically (or manually via **Run workflow**)

## Disabling Internet-Dependent Features

### agentmemory — Already Offline-Ready

The agentmemory image is already configured for offline operation:

| Setting | Purpose | Current Status |
|---------|---------|-------------------|
| `TRANSFORMERS_OFFLINE=1` | Blocks HuggingFace model downloads | ✓ Set in Dockerfile |
| `HF_HUB_OFFLINE=1` | Same, belt-and-suspenders | ✓ Set in Dockerfile |
| Pre-cached model | Xenova/all-MiniLM-L6-v2 (~23 MB) | ✓ Cached at build time |
| `TRANSFORMERS_CACHE` | Points to pre-cached model | ✓ Set to `/app/.cache/huggingface` |

**No changes needed.** The image blocks outbound internet at runtime.

### iii-engine — Check For Internet Dependencies

iii-engine v0.11.2 generally does not require internet at runtime. If it attempts outbound connections:

1. Check `iii-config.yaml` for any remote service URLs
2. Look for environment variables that enable remote calls (e.g., `PRICING_API`, `MODEL_UPDATES_URL`)
3. Disable them before deployment

Example (if present):
```bash
# In docker-compose.yml, add to iii-engine environment:
environment:
  DISABLE_PRICING_UPDATES: "true"
  DISABLE_MODEL_CHECKS: "true"
```

### Future Versions — Pattern for Disabling Internet

If a new version of agentmemory or iii-engine tries to access the internet:

1. **Identify the feature:**
   ```bash
   grep -r "http://\|https://\|curl\|wget\|fetch" <source-code>
   ```

2. **Find the environment variable or config flag:**
   - Check README of the project
   - Look for `DISABLE_*`, `*_OFFLINE`, `*_LOCAL` env vars

3. **Add to Dockerfile or docker-compose.yml:**
   ```dockerfile
   ENV MY_FEATURE_OFFLINE=1
   ENV DISABLE_REMOTE_CALLS=true
   ```

4. **Test locally** before deploying to air-gapped environment

## Submitting Changes Upstream

Consider contributing improvements to the upstream projects:

### To rohitg00/agentmemory

If you make improvements to the agentmemory build or offline support:

```bash
# Fork https://github.com/rohitg00/agentmemory
# Create branch: feature/air-gap-ready
# Add: Dockerfile, cache-models.js, docker-entrypoint.sh, GitHub Actions workflows
# Submit PR with air-gap improvements
```

### To iii-hq/iii

If you find that v0.11.2 needs adjustments for air-gapped environments:

```bash
# Open issue: "Support air-gapped deployment (disable internet features)"
```

## Troubleshooting

| Issue | Check |
|-------|-------|
| agentmemory tries to download model at runtime | `docker compose exec agentmemory env \| grep TRANSFORMERS_OFFLINE` — should be `1` |
| iii-engine unreachable from agentmemory | `docker compose logs agentmemory` — check WebSocket URL in logs |
| Image fails to load from Artifactory | Verify security scan passed; confirm registry URL is correct |
| Health check fails on startup | Wait 10-15 seconds; check `docker compose logs <service>` |

## Notes

- **agentmemory npm versions:** Any version published to npm can be built via workflow input (no code changes)
- **iii-engine version:** Pinned in code; requires edits to upgrade
- **Pre-caching:** Happens at build time only (on internet-connected GitHub Actions runners); no internet needed at runtime
- **HMAC secret:** Generated on container first start; persists across restarts via `/data` volume
